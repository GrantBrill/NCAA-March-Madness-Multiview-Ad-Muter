<!DOCTYPE html>
<html>
<head>
    <style>
        .player { width: 400px; height: 300px; border: 1px solid gray; margin: 10px; display: inline-block; position: relative; }
        ._primary_1o8ii_119 { border: 5px solid orange !important; } /* Active audio */
        .mml-subtitle-2 { font-weight: bold; padding: 5px; }
        ._brandedSlate_1ri8z_33 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; display: flex; align-items: center; justify-content: center; z-index: 10; }
        ._adCounter_q31gh_174 { position: absolute; bottom: 10px; right: 10px; background: red; color: white; padding: 2px; }
    </style>
</head>
<body>
    <div id="game1" class="player _primary_1o8ii_119" data-player-id="1">
        <div class="mml-subtitle-2">Team A vs Team B</div>
        <video></video>
    </div>
    <div id="game2" class="player" data-player-id="2">
        <div class="mml-subtitle-2">Team C vs Team D</div>
        <video></video>
    </div>
    <div id="game3" class="player" data-player-id="3">
        <div class="mml-subtitle-2">Team E vs Team F</div>
        <video></video>
    </div>

    <script>
        // Mock the click behavior to switch primary class
        document.querySelectorAll('.player').forEach(p => {
            p.addEventListener('click', () => {
                document.querySelectorAll('.player').forEach(p2 => p2.classList.remove('_primary_1o8ii_119'));
                p.classList.add('_primary_1o8ii_119');
                console.log("Audio switched to:", p.querySelector('.mml-subtitle-2').innerText);
            });
        });

        function setCommercial(gameId, active) {
            const game = document.getElementById(gameId);
            if (active) {
                const slate = document.createElement('div');
                slate.className = '_brandedSlate_1ri8z_33';
                slate.innerText = 'COMMERCIAL';
                game.appendChild(slate);
                // Simulate the site switching to ALL CAPS during commercial
                game.querySelector('.mml-subtitle-2').innerText = game.querySelector('.mml-subtitle-2').innerText.toUpperCase();
            } else {
                const slate = game.querySelector('._brandedSlate_1ri8z_33');
                if (slate) {
                    slate.remove();
                    // Restore to title case (mock-ish)
                    let text = game.querySelector('.mml-subtitle-2').innerText;
                    game.querySelector('.mml-subtitle-2').innerText = text.charAt(0) + text.slice(1).toLowerCase();
                }
            }
        }
    </script>
</body>
</html>
